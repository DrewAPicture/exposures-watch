name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Android build
        uses: DrewAPicture/exposures-common/.github/actions/setup-android-build@a01672190a84cc1c48958912b87f253e58cc5898 # v0.1.1

      - name: Run tests
        run: ./gradlew test
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Safety gate from exp-shared-library-feasibility-plan.md: phone and watch must pin the
      # same exposures-common version, since they share Data Layer DTOs/paths at runtime — a
      # mismatch here is exactly the drift this whole extraction exists to prevent.
      - name: Verify exposures-common version matches exposures-phone
        run: |
          this_version=$(grep '^exposuresCommon = ' gradle/libs.versions.toml | sed -E 's/.*"(.*)".*/\1/')
          other_version=$(curl -fsSL https://raw.githubusercontent.com/DrewAPicture/exposures-phone/main/gradle/libs.versions.toml | grep '^exposuresCommon = ' | sed -E 's/.*"(.*)".*/\1/')
          echo "watch pins exposures-common $this_version; phone pins $other_version"
          if [ "$this_version" != "$other_version" ]; then
            echo "::error::exposures-common version drift: watch=$this_version phone=$other_version"
            exit 1
          fi
