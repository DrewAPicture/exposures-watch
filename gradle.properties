org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
kotlin.code.style=official

# KSP (as used by Room) still registers generated sources via the legacy kotlin.sourceSets DSL,
# which AGP 9's built-in Kotlin support disallows by default. Re-allow it until KSP updates to
# the android.sourceSets DSL. See https://developer.android.com/r/tools/built-in-kotlin
android.disallowKotlinSourceSets=false
